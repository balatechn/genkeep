version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: genkeep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-genkeep}
      POSTGRES_USER: ${DB_USER:-genkeep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genkeep_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genkeep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genkeep_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-genkeep}:${DB_PASSWORD:-genkeep_secret}@postgres:5432/${DB_NAME:-genkeep}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: genkeep_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8888:80"
    expose:
      - "80"
    networks:
      - coolify

  proxy-restarter:
    image: docker:24-cli
    container_name: genkeep_proxy_restarter
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "echo '=== Inspecting frontend container labels ==='; docker inspect frontend-vg2fuzhhayjm3nwo3cmlznpd-$(date +%H%M%S)* 2>/dev/null | head -200 || docker ps --filter name=frontend-vg2fuzh --format '{{.Names}}' | head -1 | xargs -I {} docker inspect {} | head -200;
             echo '=== Networks of frontend container ==='; docker ps --filter name=frontend-vg2fuzh --format '{{.Names}}' | head -1 | xargs -I {} docker inspect {} --format '{{json .NetworkSettings.Networks}}';
             echo '=== Traefik http routers ==='; docker exec coolify-proxy wget -qO- http://localhost:8080/api/http/routers 2>&1 | head -200;
             echo '=== Traefik http services ==='; docker exec coolify-proxy wget -qO- http://localhost:8080/api/http/services 2>&1 | head -200;
             echo '=== Restarting coolify-proxy ==='; docker restart coolify-proxy;
             echo '=== Done ==='"

volumes:
  postgres_data:
    driver: local

networks:
  coolify:
    external: true
