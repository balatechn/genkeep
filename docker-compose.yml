version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: genkeep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-genkeep}
      POSTGRES_USER: ${DB_USER:-genkeep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genkeep_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genkeep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genkeep_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-genkeep}:${DB_PASSWORD:-genkeep_secret}@postgres:5432/${DB_NAME:-genkeep}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: genkeep_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8888:80"
    expose:
      - "80"
    networks:
      - coolify
    volumes:
      - debug_share:/usr/share/nginx/html/debug
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.http-0-vg2fuzhhayjm3nwo3cmlznpd-frontend.service=http-0-vg2fuzhhayjm3nwo3cmlznpd-frontend"
      - "traefik.http.services.http-0-vg2fuzhhayjm3nwo3cmlznpd-frontend.loadbalancer.server.port=80"

  proxy-restarter:
    image: docker:24-cli
    container_name: genkeep_proxy_restarter
    restart: "no"
    depends_on:
      - frontend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - debug_share:/share
    command: >
      sh -c "sleep 30;
             OUT=/share/info.txt;
             echo '=== docker version ===' > $$OUT;
             docker version --format '{{.Server.Version}}' >> $$OUT 2>&1;
             echo '=== docker ps frontend ===' >> $$OUT;
             docker ps --filter name=frontend-vg2fuzh --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' >> $$OUT;
             FE=$$(docker ps --filter name=frontend-vg2fuzh --format '{{.Names}}' | head -1);
             echo \"FE=$$FE\" >> $$OUT;
             echo '=== Traefik container ===' >> $$OUT;
             docker ps --filter name=coolify-proxy --format '{{.Names}}\t{{.Status}}\t{{.Image}}' >> $$OUT;
             echo '=== Traefik container args ===' >> $$OUT;
             docker inspect coolify-proxy --format '{{range .Args}}{{println .}}{{end}}' >> $$OUT 2>&1;
             echo '=== Traefik mounts ===' >> $$OUT;
             docker inspect coolify-proxy --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{println}}{{end}}' >> $$OUT 2>&1;
             echo '=== Traefik full logs (all) ===' >> $$OUT;
             docker logs coolify-proxy 2>&1 | tail -120 >> $$OUT;
             echo '=== Traefik log file inside? ===' >> $$OUT;
             docker exec coolify-proxy sh -c 'ls -la /var/log /traefik 2>&1; find / -name "*.log" 2>/dev/null | head -20' >> $$OUT;
             echo '=== Traefik sees frontend label? (via docker socket) ===' >> $$OUT;
             docker exec coolify-proxy sh -c 'wget --spider http://127.0.0.1:8080/ 2>&1 | head -3' >> $$OUT;
             echo '=== Try via coolify-proxy network 80 (raw) ===' >> $$OUT;
             wget -qO- --header='Host: vg2fuzhhayjm3nwo3cmlznpd.187.127.134.246.sslip.io' http://coolify-proxy:80/ 2>&1 | head -20 >> $$OUT;
             echo '=== Try frontend by service alias from same network ===' >> $$OUT;
             wget -qO- http://$$FE:80/ 2>&1 | head -10 >> $$OUT;
             chmod 644 $$OUT;
             sleep 5"

volumes:
  debug_share:
    driver: local
  postgres_data:
    driver: local

networks:
  coolify:
    external: true
