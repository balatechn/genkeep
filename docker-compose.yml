version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: genkeep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-genkeep}
      POSTGRES_USER: ${DB_USER:-genkeep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genkeep_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genkeep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genkeep_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-genkeep}:${DB_PASSWORD:-genkeep_secret}@postgres:5432/${DB_NAME:-genkeep}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: genkeep_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      coolify:
        aliases:
          - genkeep-frontend
      default: {}
    volumes:
      - debug_share:/usr/share/nginx/html/debug
    labels:
      - "traefik.enable=true"

  traefik-config-loader:
    image: docker:24-cli
    container_name: genkeep_traefik_loader
    restart: "no"
    depends_on:
      - frontend
    environment:
      TRAEFIK_CONFIG_B64: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - debug_share:/share
    command: >
      sh -c "sleep 10;
             echo \"$$TRAEFIK_CONFIG_B64\" | base64 -d > /tmp/cfg.yaml;
             docker exec coolify-proxy rm -rf /traefik/dynamic/genkeep-frontend.yaml 2>/dev/null;
             docker cp /tmp/cfg.yaml coolify-proxy:/traefik/dynamic/genkeep-frontend.yaml && echo 'traefik config installed' || echo 'install failed';
             sleep 20;
             OUT=/share/info.txt;
             echo '=== containers ===' > $$OUT;
             docker ps -a --filter name=vg2fuzh --format '{{.Names}}\t{{.Status}}' >> $$OUT;
             BE=$$(docker ps -a --filter name=backend-vg2fuzh --format '{{.Names}}' | head -1);
             FE=$$(docker ps --filter name=frontend-vg2fuzh --format '{{.Names}}' | head -1);
             echo \"BE=$$BE FE=$$FE\" >> $$OUT;
             echo '=== backend logs ===' >> $$OUT;
             docker logs --tail 60 $$BE >> $$OUT 2>&1;
             echo '=== backend networks ===' >> $$OUT;
             docker inspect $$BE --format '{{range \\$$k, \\$$v := .NetworkSettings.Networks}}{{\\$$k}} ip={{\\$$v.IPAddress}}{{println}}{{end}}' >> $$OUT 2>&1;
             echo '=== frontend networks ===' >> $$OUT;
             docker inspect $$FE --format '{{range \\$$k, \\$$v := .NetworkSettings.Networks}}{{\\$$k}} ip={{\\$$v.IPAddress}}{{println}}{{end}}' >> $$OUT 2>&1;
             echo '=== frontend nslookup backend ===' >> $$OUT;
             docker exec $$FE sh -c 'getent hosts backend; wget -qSO- http://backend:4000/api/health 2>&1 | head -10' >> $$OUT 2>&1;
             chmod 644 $$OUT;
             sleep 5"

volumes:
  debug_share:
    driver: local
  postgres_data:
    driver: local

networks:
  coolify:
    external: true
  default:
    name: vg2fuzhhayjm3nwo3cmlznpd
    external: true
