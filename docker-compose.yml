version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: genkeep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-genkeep}
      POSTGRES_USER: ${DB_USER:-genkeep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genkeep_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genkeep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genkeep_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-genkeep}:${DB_PASSWORD:-genkeep_secret}@postgres:5432/${DB_NAME:-genkeep}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: genkeep_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8888:80"
    expose:
      - "80"
    networks:
      coolify:
        aliases:
          - genkeep-frontend
    volumes:
      - debug_share:/usr/share/nginx/html/debug
    labels:
      - "traefik.enable=true"

  proxy-restarter:
    image: docker:24-cli
    container_name: genkeep_proxy_restarter
    restart: "no"
    depends_on:
      - frontend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - debug_share:/share
    command: >
      sh -c "sleep 20;
             OUT=/share/info.txt;
             echo '=== writing traefik file-provider config ===' > $$OUT;
             docker exec coolify-proxy sh -c 'cat > /traefik/dynamic/genkeep-frontend.yaml <<EOF
http:
  routers:
    genkeep-frontend:
      rule: \"Host(\\\`vg2fuzhhayjm3nwo3cmlznpd.187.127.134.246.sslip.io\\\`)\"
      service: genkeep-frontend
      entryPoints:
        - http
      priority: 1000
  services:
    genkeep-frontend:
      loadBalancer:
        servers:
          - url: \"http://genkeep-frontend:80\"
EOF
ls -la /traefik/dynamic/' >> $$OUT 2>&1;
             sleep 5;
             echo '=== test domain via coolify-proxy ===' >> $$OUT;
             wget -qO- --header='Host: vg2fuzhhayjm3nwo3cmlznpd.187.127.134.246.sslip.io' http://coolify-proxy:80/ 2>&1 | head -20 >> $$OUT;
             echo '=== traefik logs last 60 ===' >> $$OUT;
             docker logs --tail 60 coolify-proxy >> $$OUT 2>&1;
             chmod 644 $$OUT;
             sleep 5"

volumes:
  debug_share:
    driver: local
  postgres_data:
    driver: local

networks:
  coolify:
    external: true
