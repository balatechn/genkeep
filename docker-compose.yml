version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-genkeep}
      POSTGRES_USER: ${DB_USER:-genkeep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genkeep_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genkeep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-genkeep}:${DB_PASSWORD:-genkeep_secret}@postgres:5432/${DB_NAME:-genkeep}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      coolify:
        aliases:
          - genkeep-frontend
      default: {}
    labels:
      - "traefik.enable=true"

  traefik-config-loader:
    image: docker:24-cli
    restart: "no"
    depends_on:
      - frontend
    environment:
      TRAEFIK_CONFIG_B64: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "sleep 10;
             echo \"$$TRAEFIK_CONFIG_B64\" | base64 -d > /tmp/cfg.yaml;
             docker exec coolify-proxy rm -rf /traefik/dynamic/genkeep-frontend.yaml 2>/dev/null;
             docker cp /tmp/cfg.yaml coolify-proxy:/traefik/dynamic/genkeep-frontend.yaml && echo 'traefik config installed' || echo 'install failed';"

  postgres-n8n:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n_secret}
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      - postgres-n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres-n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_secret}
      N8N_HOST: n8n.187.127.134.246.sslip.io
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n.187.127.134.246.sslip.io
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-changeme_please_replace}
      GENERIC_TIMEZONE: UTC
    expose:
      - "5678"
    networks:
      coolify:
        aliases:
          - n8n
      default: {}

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  postgres_n8n_data:
    driver: local

networks:
  coolify:
    external: true
  default:
    name: vg2fuzhhayjm3nwo3cmlznpd
    external: true
