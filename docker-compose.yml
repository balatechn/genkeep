version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: genkeep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-genkeep}
      POSTGRES_USER: ${DB_USER:-genkeep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genkeep_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genkeep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genkeep_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-genkeep}:${DB_PASSWORD:-genkeep_secret}@postgres:5432/${DB_NAME:-genkeep}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: genkeep_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8888:80"
    expose:
      - "80"
    networks:
      coolify:
        aliases:
          - genkeep-frontend
    volumes:
      - debug_share:/usr/share/nginx/html/debug
    labels:
      - "traefik.enable=true"

  proxy-restarter:
    image: docker:24-cli
    container_name: genkeep_proxy_restarter
    restart: "no"
    depends_on:
      - frontend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/coolify/proxy/dynamic:/traefik-dynamic
      - ./traefik-dynamic/genkeep-frontend.yaml:/srv/genkeep-frontend.yaml:ro
      - debug_share:/share
    command: >
      sh -c "sleep 15;
             OUT=/share/info.txt;
             echo '=== source file in helper ===' > $$OUT;
             ls -la /srv/ >> $$OUT 2>&1;
             cat /srv/genkeep-frontend.yaml >> $$OUT 2>&1;
             echo '=== target dir before ===' >> $$OUT;
             ls -la /traefik-dynamic/ >> $$OUT 2>&1;
             echo '=== try direct cp (host bind) ===' >> $$OUT;
             cp -v /srv/genkeep-frontend.yaml /traefik-dynamic/genkeep-frontend.yaml >> $$OUT 2>&1 || echo \"cp-host failed: $$?\" >> $$OUT;
             echo '=== try docker cp to coolify-proxy ===' >> $$OUT;
             docker cp /srv/genkeep-frontend.yaml coolify-proxy:/traefik/dynamic/genkeep-frontend.yaml >> $$OUT 2>&1 || echo \"docker-cp failed: $$?\" >> $$OUT;
             echo '=== target dir after ===' >> $$OUT;
             docker exec coolify-proxy ls -la /traefik/dynamic/ >> $$OUT 2>&1;
             sleep 6;
             echo '=== test via coolify-proxy ===' >> $$OUT;
             wget -qSO- --header='Host: vg2fuzhhayjm3nwo3cmlznpd.187.127.134.246.sslip.io' http://coolify-proxy:80/ 2>&1 | head -40 >> $$OUT;
             echo '=== traefik logs tail 60 ===' >> $$OUT;
             docker logs --tail 60 coolify-proxy >> $$OUT 2>&1;
             chmod 644 $$OUT;
             sleep 5"

volumes:
  debug_share:
    driver: local
  postgres_data:
    driver: local

networks:
  coolify:
    external: true
