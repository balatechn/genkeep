version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: genkeep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-genkeep}
      POSTGRES_USER: ${DB_USER:-genkeep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genkeep_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genkeep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genkeep_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-genkeep}:${DB_PASSWORD:-genkeep_secret}@postgres:5432/${DB_NAME:-genkeep}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: genkeep_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - coolify
    labels:
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.http-0-vg2fuzhhayjm3nwo3cmlznpd-frontend.service=http-0-vg2fuzhhayjm3nwo3cmlznpd-frontend"
      - "traefik.http.services.http-0-vg2fuzhhayjm3nwo3cmlznpd-frontend.loadbalancer.server.port=80"

  debug:
    image: alpine:3.19
    container_name: genkeep_debug
    restart: "no"
    networks:
      - coolify
    command: >
      sh -c "echo '=== ip a ===' && ip a;
             echo '=== resolving coolify-proxy ===' && nslookup coolify-proxy || true;
             echo '=== wget traefik api routers ===' && wget -qO- http://coolify-proxy:8080/api/http/routers || echo 'FAILED';
             echo '=== wget traefik api services ===' && wget -qO- http://coolify-proxy:8080/api/http/services || echo 'FAILED';
             echo '=== ping frontend by hostname ===' && wget -qO- --timeout=5 http://frontend-vg2fuzhhayjm3nwo3cmlznpd-155941755845:80/ | head -c 200 || echo 'cannot reach frontend';
             sleep 600"

volumes:
  postgres_data:
    driver: local

networks:
  coolify:
    external: true
